# Cau hinh deploy Render (Blueprint).
# LUU Y: file nay chi duoc Render doc khi service duoc tao/quan ly bang Blueprint.
# Service tao tay tren dashboard van dung Root Directory + Build/Start Command trong
# dashboard -> phai sua tay cho khop, hoac chuyen service sang Blueprint.
services:
  - type: web
    name: vuhp-smarthome
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      # --- Tuya Cloud (cua cuon + may cho an Rojeco dung chung 1 project) ---
      - key: TUYA_ACCESS_ID
        sync: false
      - key: TUYA_ACCESS_KEY
        sync: false
      - key: TUYA_API_ENDPOINT
        value: https://openapi-sg.iotbing.com/
      # --- VeSync (may loc khi - 1 tai khoan dung chung ca nha) ---
      - key: VESYNC_EMAIL
        sync: false
      - key: VESYNC_PASSWORD
        sync: false
      # --- OpenRouter (AI parse lenh giong noi) ---
      - key: OPENROUTER_API_KEY
        sync: false
      # --- Postgres (Supabase) ---
      # Khong dat -> app fallback SQLite, ma o dia Render la ephemeral nen lich
      # hen MAT moi lan deploy. Phai dung chuoi "Session pooler" (IPv4): Direct
      # connection cua Supabase chi co IPv6, Render free khong ho tro.
      # Huong dan: backend/docs/SUPABASE_SETUP.md
      - key: DATABASE_URL
        sync: false
      # --- Dang nhap & phan quyen (Phase 1b/2) ---
      # CHUA dat SUPABASE_JWT_SECRET -> xac thuc TU TAT (moi request coi nhu
      # chu nha). Dat vao -> xac thuc tu BAT. Khong can AUTH_DISABLED.
      # Chi dat SUPABASE_JWT_SECRET SAU KHI app da co dang nhap va da cai len
      # het dien thoai trong nha, neu khong ca nha bi 401.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Ky token dai han cho Home Widget / shortcut (isolate nen). Khong dat
      # thi dung chung SUPABASE_JWT_SECRET. Thu hoi = doi gia tri nay.
      - key: APP_TOKEN_SECRET
        sync: false
